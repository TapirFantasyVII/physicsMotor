plugins {
    id 'java'
    id 'application'
}

version '1.0'
group 'circulo'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'Main'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
    }
}

defaultTasks 'run'
